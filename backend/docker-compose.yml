version: '3.8'

services:
  backend:
    image: ghcr.io/jgugamelo/whatsapp-backend:latest
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - WAHA_BASE_URL=${WAHA_BASE_URL}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - FRONTEND_URL=${FRONTEND_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    command: >-
      /bin/sh -c "printf 'server {\n  listen 80;\n  server_name _;\n  client_max_body_size 50m;\n  location / {\n    proxy_pass http://backend:3001;\n    proxy_http_version 1.1;\n    proxy_set_header Host $$host;\n    proxy_set_header X-Real-IP $$remote_addr;\n    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $$scheme;\n    proxy_read_timeout 120s;\n  }\n}\n'
      > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    depends_on:
      - backend
    restart: unless-stopped
